# Nginx dentro del contenedor del frontend.
# Solo maneja: servir archivos estáticos + SPA fallback.
# El proxy al gateway lo hace el Nginx principal (infra/nginx/default.conf).

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para archivos estáticos (mejora tiempo de carga)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache agresivo para assets con hash en el nombre (Vite los genera así)
    # Ej: index-B-Y0qZz1.js → el nombre cambia si el contenido cambia
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: cualquier ruta que no sea un archivo real
    # devuelve index.html para que React Router maneje la navegación.
    # Sin esto, recargar /trabunda daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
