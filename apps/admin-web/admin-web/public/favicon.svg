<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fondo marino oscuro -->
  <rect width="64" height="64" rx="12" fill="#0d1520"/>

  <!-- Ola azul inferior (referencia marina / Pesceros Marinos) -->
  <path d="M4 54 Q14 49 24 54 Q34 59 44 54 Q54 49 62 52"
        stroke="#29b6f6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M4 59 Q14 54 24 59 Q34 64 44 59 Q54 54 62 57"
        stroke="#0284c7" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Cuerpo del camarón (curva en C, trazo grueso) -->
  <path d="M46 14 C54 22 52 36 44 44 C36 50 22 50 14 42"
        stroke="#e53935" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cabeza / cefalotórax -->
  <circle cx="46" cy="14" r="7" fill="#e53935"/>

  <!-- Ojo -->
  <circle cx="49" cy="11" r="2" fill="#0d1520"/>
  <circle cx="49.8" cy="10.2" r="0.7" fill="#ffffff"/>

  <!-- Rostro (punta frontal de la cabeza) -->
  <path d="M51 9 L60 4" stroke="#e53935" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Antenas largas -->
  <path d="M49 7  Q56 2  64 1"  stroke="#ef9a9a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M51 10 Q60 7  66 8"  stroke="#ef9a9a" stroke-width="1"   fill="none" stroke-linecap="round"/>

  <!-- Pinza / quela -->
  <path d="M34 22 C28 17 18 18 16 26 C14 33 19 38 25 35"
        stroke="#e53935" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- punta de la pinza -->
  <path d="M16 26 C14 20 8 20 6 26" stroke="#e53935" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Patas (pequeñas líneas bajo el cuerpo) -->
  <path d="M28 36 L24 42" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
  <path d="M34 38 L30 44" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 38 L38 44" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>

  <!-- Abanico de cola (pleopodos) -->
  <path d="M14 42 L6  52" stroke="#c62828" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M14 42 L10 54" stroke="#c62828" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M14 42 L16 54" stroke="#c62828" stroke-width="2"   fill="none" stroke-linecap="round"/>
  <path d="M14 42 L22 52" stroke="#c62828" stroke-width="2"   fill="none" stroke-linecap="round"/>
</svg>
