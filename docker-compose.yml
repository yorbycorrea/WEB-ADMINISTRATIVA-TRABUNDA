services:

  # ── Nginx principal: único punto de entrada ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: admin-suite-nginx
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - admin-web
    networks:
      - admin-net
    restart: unless-stopped

  # ── PostgreSQL: base de datos del Admin Suite ─────────────────────────────
  # Guarda usuarios, estadísticas y todo lo que se agregue a futuro.
  postgres:
    image: postgres:16-alpine
    container_name: admin-suite-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Los datos de la BD persisten en este volumen aunque se haga docker-compose down
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - admin-net
    restart: unless-stopped
    # Healthcheck: Docker espera a que Postgres esté listo antes de arrancar el gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Gateway: API central con autenticación JWT ────────────────────────────
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: admin-suite-gateway
    expose:
      - "3000"
    environment:
      - GATEWAY_PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - SUPERADMIN_USER=${SUPERADMIN_USER}
      - SUPERADMIN_PASS=${SUPERADMIN_PASS}
      # Conexión a PostgreSQL
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # APIs internas
      - TRABUNDA_API_PORT=3001
      - RUTAS_API_PORT=3002
      - TRABUNDA_API_URL=http://trabunda-api:3001
      - RUTAS_API_URL=http://rutas-api:3002
      # Backends reales
      - TRABUNDA_BACKEND_URL=${TRABUNDA_BACKEND_URL}
      - TRABUNDA_ADMIN_USER=${TRABUNDA_ADMIN_USER}
      - TRABUNDA_ADMIN_PASS=${TRABUNDA_ADMIN_PASS}
      - RUTAS_BACKEND_URL=${RUTAS_BACKEND_URL}
      - RUTAS_ADMIN_USER=${RUTAS_ADMIN_USER}
      - RUTAS_ADMIN_PASS=${RUTAS_ADMIN_PASS}
    depends_on:
      postgres:
        condition: service_healthy   # espera a que postgres esté listo
      trabunda-api:
        condition: service_started
      rutas-api:
        condition: service_started
    networks:
      - admin-net
    restart: unless-stopped

  # ── Trabunda API stub ─────────────────────────────────────────────────────
  trabunda-api:
    build:
      context: ./apps/trabunda-api
      dockerfile: Dockerfile
    container_name: admin-suite-trabunda-api
    expose:
      - "3001"
    environment:
      - TRABUNDA_API_PORT=3001
    networks:
      - admin-net
    restart: unless-stopped

  # ── Rutas API stub ────────────────────────────────────────────────────────
  rutas-api:
    build:
      context: ./apps/rutas-api
      dockerfile: Dockerfile
    container_name: admin-suite-rutas-api
    expose:
      - "3002"
    environment:
      - RUTAS_API_PORT=3002
    networks:
      - admin-net
    restart: unless-stopped

  # ── Frontend React (compilado y servido por Nginx) ────────────────────────
  admin-web:
    build:
      context: ./apps/admin-web/admin-web
      dockerfile: Dockerfile
    container_name: admin-suite-web
    expose:
      - "80"
    networks:
      - admin-net
    restart: unless-stopped

# ── Red interna ───────────────────────────────────────────────────────────────
networks:
  admin-net:
    driver: bridge

# ── Volúmenes persistentes ────────────────────────────────────────────────────
# Sobreviven a docker-compose down. Solo se borran con docker-compose down -v
volumes:
  postgres-data:   # datos de PostgreSQL
