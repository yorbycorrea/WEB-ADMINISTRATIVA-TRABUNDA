# ─────────────────────────────────────────────
#  Nginx principal — Admin Suite
#  Puerto 80 expuesto al exterior.
#
#  Rutas de la API (van al gateway:3000):
#    /auth/*        → login, /auth/me
#    /services/*    → health checks de servicios
#    /dashboard/*   → datos de Trabunda y Rutas (/dashboard/trabunda, /dashboard/rutas)
#    /admin/*       → gestión de usuarios (/admin/users)
#    /api/*         → proxies internos a trabunda-api y rutas-api
#    /health        → health check del gateway
#
#  Todo lo demás → frontend React (admin-web:80)
#    /             → Dashboard Overview
#    /trabunda     → página Trabunda (React Router)
#    /rutas        → página Rutas (React Router)
#    /usuarios     → página Usuarios (React Router)
# ─────────────────────────────────────────────

upstream gateway {
    server gateway:3000;
}

upstream frontend {
    server admin-web:80;
}

# Bloque de proxy headers reutilizable
map $host $proxy_host { default $host; }

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ── API: proxy al Gateway ─────────────────────────────────────

    location /auth/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /services/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /dashboard/* — datos de Trabunda y Rutas que devuelve el gateway
    location /dashboard/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin/* — gestión de usuarios (solo superadmin)
    location /admin/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
    }

    # ── Frontend SPA ───────────────────────────────────────────────
    # /trabunda, /rutas, /usuarios, / → React Router los maneja.
    # El nginx del contenedor admin-web tiene "try_files $uri /index.html"
    # para que al recargar la página no devuelva 404.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
