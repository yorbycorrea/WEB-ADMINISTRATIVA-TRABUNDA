# ─────────────────────────────────────────────
#  Nginx principal — Admin Suite
#  Puerto 80 expuesto al exterior.
#
#  Tráfico que llega aquí:
#    /auth/*     → gateway:3000
#    /services/* → gateway:3000
#    /trabunda/* → gateway:3000  (solo los endpoints del gateway, no la página)
#    /rutas/*    → gateway:3000
#    /api/*      → gateway:3000
#    todo lo demás → frontend (contenedor admin-web en puerto 80)
# ─────────────────────────────────────────────

upstream gateway {
    # "gateway" es el nombre del servicio en docker-compose.yml
    # Docker resuelve este nombre a la IP interna del contenedor
    server gateway:3000;
}

upstream frontend {
    server admin-web:80;
}

server {
    listen 80;
    server_name _;  # acepta cualquier hostname

    # Tamaño máximo del body (por si se suben archivos)
    client_max_body_size 10M;

    # ── Proxy al Gateway ──────────────────────────────────────────
    # Todos los endpoints de la API van al Gateway.
    # El orden importa: las reglas más específicas van primero.

    location /auth/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /services/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /trabunda/ y /rutas/ son endpoints del gateway
    # (no confundir con las páginas del frontend que maneja React Router)
    location /trabunda/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rutas/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
    }

    # ── Frontend ───────────────────────────────────────────────────
    # Todo lo que no es API va al contenedor del frontend.
    # El frontend tiene su propio Nginx que maneja el SPA fallback.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}
